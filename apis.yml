aid: obol
name: Obol
description: >-
  Obol builds distributed validator infrastructure for Ethereum, letting a validator be
  run across multiple independent operators and machines (a Distributed Validator, or DV)
  instead of a single node, which removes single points of failure in proof-of-stake
  staking. Its core software is Charon, a Go middleware client that coordinates the
  operators, plus the DV Launchpad dapp, the Obol Splits smart contracts, and the Obol
  API (api.obol.tech) with a TypeScript SDK for creating and managing clusters. The Obol
  API exposes cluster definitions, cluster locks, validator states, exits, deposits, fee
  recipients, effectiveness, peer scores, Techne credentials, and network staking metrics.
